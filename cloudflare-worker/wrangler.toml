# Cloudflare Worker 部署配置（wrangler）
# 用法（本目录下）：
#   npx wrangler deploy            # 部署
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put CRON_SECRET
# 注意：敏感值（Supabase 密钥等）务必用 wrangler secret 设置，不要写进本文件。

name = "podcast-transcriber"
main = "worker.js"
compatibility_date = "2025-01-01"

# Workers AI 绑定：代码里用 env.AI.run(...)
[ai]
binding = "AI"

# 定时触发（可选）：每小时跑一次转录。
# 免费套餐的 Cron 触发频率限制以控制台/wrangler 提示为准；若每小时不被允许，
# 改成每天一次（如 "0 3 * * *"），或只用手动触发（POST /run + x-cron-secret）。
[[crons]]
cron = "0 * * * *"

# 非敏感调参变量（与 worker.js 中读取的环境变量同名）
[vars]
TRANSCRIPT_CF_CHUNK_SECONDS = "600"
TRANSCRIPT_CF_CHUNK_CONCURRENCY = "3"
TRANSCRIPT_CF_MAX_AUDIO_MB = "24"
TRANSCRIPT_MAX_ATTEMPTS = "3"
